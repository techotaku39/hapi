name: Record isolated HAPI parity fixtures
on:
  workflow_dispatch:
  push:
    branches: [ci/pr1692-parity-record]
permissions:
  contents: read
jobs:
  record:
    runs-on:
  workflow_dispatch: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Record and verify the golden traces
        run: bun run parity:record && bun run test:parity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-goldens
          path: cli/src/parity/corpus/claude/*/golden.ts.json

