name: Generate Share Turn Linux Snapshot

on:
    push:
        branches:
            - fix/share-export-inline-code

jobs:
    snapshot:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - run: bun install
            - run: bunx playwright install --with-deps chromium
            - run: bun run test:e2e -- share-turn.spec.ts --update-snapshots
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: share-turn-linux-snapshot
                  path: e2e/share-turn.spec.ts-snapshots
